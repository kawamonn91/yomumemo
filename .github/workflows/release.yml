# CD。v で始まるタグ（v1.2.3 など）を push すると、署名済みのリリース版（APK と Google Play 用の AAB）を作って GitHub Releases に置く（docs/ci.md の「CD」）。
# 手動で動かした（workflow_dispatch）ときは、署名済みのビルドと署名の確かめまでにして、リリースは作らない（CD の動作確認用）。
# T-tech Store への公開は、ここで作った APK を手元から appstore の publish-app.mjs で行う（本番の鍵を GitHub に置かないため）。
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # ストアに出している版と同じ鍵か（証明書の SHA-256。APK から誰でも読める値なので、ここに書いてよい）
  EXPECTED_CERT_SHA256: ba3e614d2113232cf411d59fd9683ca1aeb8aa9af1c23bad2fcd4472dd3d4853

jobs:
  release:
    name: release
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      # アクションは改ざんに備えてコミットの SHA で固定する（コメントは版）
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      # Gradle の準備とキャッシュ。gradle-wrapper.jar が公式のものかも確かめる
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Android SDK (compileSdk 37) の準備
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0"
          if [ ! -d "$ANDROID_HOME/platforms/android-37" ]; then
            cp -r "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi

      - name: 版を読む（タグのときは、タグと合っているか確かめる）
        run: |
          version="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle.kts | head -n 1)"
          if [ -z "$version" ]; then echo "::error::app/build.gradle.kts から versionName を読めません"; exit 1; fi
          echo "versionName: $version / ref: $GITHUB_REF_NAME"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::タグ（$GITHUB_REF_NAME）が app/build.gradle.kts の versionName（$version）と合いません"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      # 署名鍵と設定は GitHub Secrets から書き出す（ログに出さない。終わったら消す）
      - name: 署名鍵と設定を書き出す
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          GOOGLE_BOOKS_API_KEY: ${{ secrets.GOOGLE_BOOKS_API_KEY }}
        run: |
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then echo "::error::GitHub Secrets の $name がありません（docs/ci.md）"; exit 1; fi
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
          # Google Books API キーは任意（無ければ openBD だけで動く。app/build.gradle.kts）
          if [ -n "$GOOGLE_BOOKS_API_KEY" ]; then
            printf 'googleBooksApiKey=%s\n' "$GOOGLE_BOOKS_API_KEY" > local.properties
          fi

      # AGP 9 では単体テストはテスト対象のビルドタイプ（debug）にだけ作られる（testReleaseUnitTest は無い）
      - name: 単体テストとリリース版のビルド
        run: ./gradlew --console=plain :app:testDebugUnitTest :app:assembleRelease :app:bundleRelease

      - name: 署名を確かめて、置くものを集める
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)/apksigner"
          "$apksigner" verify --print-certs "$apk" | tee "$RUNNER_TEMP/certs.txt" | grep -E "certificate (DN|SHA-256)"
          if ! grep -qi "certificate SHA-256 digest: $EXPECTED_CERT_SHA256" "$RUNNER_TEMP/certs.txt"; then
            echo "::error::ストアに出している版と違う鍵で署名されています（GitHub Secrets の鍵を確かめる）"
            exit 1
          fi
          # Google Play に上げる AAB（アップロード鍵で署名）も同じ鍵か確かめる
          aab=app/build/outputs/bundle/release/app-release.aab
          aab_sha="$(keytool -printcert -jarfile "$aab" | sed -nE 's/^[[:space:]]*SHA256:[[:space:]]*//p' | head -n 1 | tr -d ':' | tr 'A-F' 'a-f')"
          if [ "$aab_sha" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::AAB が違う鍵で署名されています（$aab_sha）"
            exit 1
          fi
          mkdir dist
          cp "$apk" "dist/yomumemo-$VERSION.apk"
          cp "$aab" "dist/yomumemo-$VERSION.aab"
          (cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS)

      - name: リリースを作る
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --target "$GITHUB_SHA" --title "ヨムメモ $VERSION" \
            --notes "署名済みのリリース版（コミット $GITHUB_SHA）。T-tech Store への公開は docs/ci.md の「CD」の手順で行う。"

      - name: 署名鍵を消す
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" keystore.properties local.properties
